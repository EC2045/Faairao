<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faairao Tester</title>

<!-- OGP Tags -->
<meta property="og:title" content="Faairao Tester">
<meta property="og:description" content="Faairao Engine Testing and Rendering Tool">
<meta property="og:type" content="website">

<script src="./index.js" defer></script>
  <link rel="stylesheet" href="src/1da5512c.css">
</head>
<body>

<header>
  <h1>Faairao</h1>
  <span class="tag">TESTER</span>
  <span class="src">
    <a href="https://ec2045.github.io/Faairao/index.js" target="_blank">ec2045.github.io/Faairao/index.js</a>
  </span>
</header>

<main>
  <!-- 左: 入力 -->
  <div class="panel">
    <div class="panel-label">Input</div>

    <textarea id="input-text" placeholder="例: SHUNYU / RITSUTO AGA ..." oninput="doRender()"></textarea>

    <div>
      <div class="panel-label" style="margin-bottom:.6rem">Presets</div>
      <div class="presets">
        <button class="preset-btn" data-text="SHUNYU">SHUNYU</button>
        <button class="preset-btn" data-text="RITSUTO AGA">RITSUTO AGA</button>
      </div>
    </div>

    <button class="render-btn" id="render-btn">▶ Render</button>

    <div class="error-banner" id="error-banner"></div>

    <div>
      <div class="panel-label" style="margin-bottom:.5rem">parseText() output</div>
      <div class="dump" id="parse-dump">—</div>
    </div>
  </div>

  <!-- 右: 出力 -->
  <div class="panel">
    <div class="panel-label">Rendered Output</div>
    <div id="faairao-output" class="empty"></div>

    <div>
      <div class="panel-label" style="margin-bottom:.5rem">DOM Snapshot</div>
      <div class="dump" id="dom-dump">—</div>
    </div>
  </div>
  <!-- デバッグパネル -->
  <div class="debug-section">
    <div class="panel-label">🔬 Debug — Block Inspector</div>
    <div class="debug-grid" id="debug-grid">
      <div class="debug-card" style="color:var(--muted)">レンダリング後に各ブロックの詳細がここに表示されます</div>
    </div>
  </div>
</main>

<footer>
  <span id="engine-status">checking engine...</span>
  <span id="block-count">blocks: —</span>
</footer>
  <script src="src/aaa1ad2e.js"></script>
</body>
</html>
